<section class="home-section home-quick-section home-theme-white">
  <div class="home-shell">
    <div class="home-quick-layout">
      <div class="home-quick-heading">
        <p class="home-section-kicker">Быстрый доступ</p>
        {% if value.heading %}<h2 class="home-section-heading">{{ value.heading }}</h2>{% endif %}
      </div>
      <nav class="home-actions home-quick-actions" aria-label="Быстрые ссылки">
        {% for link in value.links %}
          <a class="home-pill" href="{{ link.url }}">
            <span class="home-arrow" aria-hidden="true">↗</span>
            <span>{{ link.label }}</span>
          </a>
        {% endfor %}
      </nav>
    </div>
  </div>
</section>
