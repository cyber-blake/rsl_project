
{% load tz %}

<div class="comments-list">
  {% for comment in comments %}
    <div class="comment" id="comment-container-{{ comment.id }}">

      <div class="comment-header">
        <div class="comment-author">
          <div class="author-info">
            <h4>{{ comment.author }}</h4>
            <div class="comment-date">
              {{ comment.pub_date|timezone:"Europe/Moscow"|date:"j F Y, H:i" }}
            </div>
          </div>
        </div>
      </div>

      <div class="comment-text">
        {{ comment.commentText }}
      </div>

      <div class="comment-reply">
        <button class="reply-btn">Ответить</button>
      </div>

      {% if user.is_authenticated and comment.author == user %}
        <div class="comment-actions">
          <form method="post"
                action="{% url 'delete_comment' comment.id %}"
                style="display:inline;">
            {% csrf_token %}
            <button type="submit">Удалить</button>
          </form>

          <button type="button" onclick="toggleEdit('{{ comment.id }}')">
            Редактировать
          </button>
        </div>

        <div id="edit-form-{{ comment.id }}"
             style="display:none; margin-top:10px;">

          <textarea id="input-{{ comment.id }}"
                    style="width:100%;">{{ comment.commentText }}</textarea>

          <br>

          <button type="button" onclick="saveEdit('{{ comment.id }}')">
            Сохранить
          </button>

          <button type="button" onclick="toggleEdit('{{ comment.id }}')">
            Отмена
          </button>
        </div>
      {% endif %}

    </div>
  {% endfor %}
</div>
